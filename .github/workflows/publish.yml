name: Publish to npm

# Publishes bride-cli to npm via Trusted Publishing (OIDC) — no npm token in
# repository secrets. One-time setup: configure a Trusted Publisher on
# npmjs.com for the bride-cli package (GitHub Actions, Iskra-YT/bride,
# publish.yml).
#
# Release flow:
#   1. Bump "version" in package.json (and package-lock.json).
#   2. git tag v<version>
#   3. git push origin main --tags

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Don't restore caches in a privileged (id-token) job.
          package-manager-cache: false

      - name: Verify tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Publish package
        run: npm publish
