name: Smoke

# Tests the package the way a user consumes it: `npm pack`, install the tarball
# into an empty directory, `bride create app --lang <language>`, `bride build`,
# and then run the result. See tests/smoke/smoke.mjs.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a broken toolchain release is caught even without a commit.
    - cron: "0 6 * * 1"

# A newer push to the same ref makes older runs pointless — cancel them
# (but never cancel runs on main, where every commit should get a verdict).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke:
    name: ${{ matrix.language }}
    # Pinned: `ubuntu-latest` migrates to a new LTS every couple of years and
    # that silently changes the toolchains (Emscripten, C3, Zig).
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        language: [c, cpp, c3, zig]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # `bride build` compiles with emcc, em++ and emar. The version is pinned
      # so the action caches the SDK between runs (a `latest` version would
      # not) and so a new Emscripten release can't break CI without a commit.
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.12"
          actions-cache-folder: "emsdk-cache"

      - name: Check the toolchain
        run: |
          emcc --version
          em++ --version

      - name: Install the C3 compiler
        if: matrix.language == 'c3'
        run: |
          set -euo pipefail
          c3_dir="$HOME/.local/c3"
          mkdir -p "$c3_dir"
          curl -fsSL https://github.com/c3lang/c3c/releases/latest/download/c3-linux-static.tar.gz \
            | tar -xz -C "$c3_dir"
          # Some releases unpack into a subdirectory.
          if [ ! -x "$c3_dir/c3c" ]; then
            mv "$c3_dir"/*/* "$c3_dir"/
          fi
          chmod +x "$c3_dir/c3c"
          echo "$c3_dir" >> "$GITHUB_PATH"
          export PATH="$c3_dir:$PATH"
          c3c --version

      - name: Install the Zig compiler
        if: matrix.language == 'zig'
        run: |
          set -euo pipefail
          zig_version=0.17.0
          zig_dir="$HOME/.local/zig"
          mkdir -p "$zig_dir"
          curl -fsSL "https://ziglang.org/download/$zig_version/zig-x86_64-linux-$zig_version.tar.xz" \
            | tar -xJ -C "$zig_dir" --strip-components=1
          echo "$zig_dir" >> "$GITHUB_PATH"
          export PATH="$zig_dir:$PATH"
          zig version

      - name: Pack Bride, install it, scaffold and build it
        run: |
          node tests/smoke/smoke.mjs --lang ${{ matrix.language }} \
            --keep --workspace "$RUNNER_TEMP/bride-smoke"

      - name: Upload the built app
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-dist-${{ matrix.language }}
          path: ${{ runner.temp }}/bride-smoke/app-*/app/dist
          if-no-files-found: ignore

  # The same flow in a real browser: this is what catches problems on the
  # browser side of the runtime (ES modules, streaming WASM compilation, DOM).
  browser:
    name: chromium
    # Pinned, like the smoke job above.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.12"
          actions-cache-folder: "emsdk-cache"

      - name: Pack, build and run the app in Chromium
        run: |
          node tests/smoke/smoke.mjs --lang c --browser \
            --keep --workspace "$RUNNER_TEMP/bride-smoke"

      - name: Upload the built app
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-dist-chromium
          path: ${{ runner.temp }}/bride-smoke/app-*/app/dist
          if-no-files-found: ignore
